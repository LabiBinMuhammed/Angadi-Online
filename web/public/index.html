<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Angadi Online</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #25D366;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
    }
    .logo-container {
      width: 110px;
      height: 110px;
      background: #ffffff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      margin-bottom: 24px;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 6px 0;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.85;
      margin: 0;
    }
    .spinner {
      margin-top: 40px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="/logo.png" alt="Angadi Logo" class="logo-img">
  </div>
  <h1 class="title">Angadi</h1>
  <p class="subtitle">Your local marketplace</p>
  <div class="spinner"></div>

  <script>
    // Automatic fallback navigation
    if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
      window.location.replace('/en/home');
    }
  </script>
</body>
</html>
